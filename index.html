<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library
    </title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <button id="add-book">Add a new book</button>
    <form>
        <button id="cancel">X</button>
        <header>
            <h2>Please fill out all the information below.</h2>
        </header>
        <p>
            <label for="title">Title</label>
            <input 
            id="title"
            name="title"
            type="text"
            required
            minlength="1"
            maxlength="99"
            placeholder=""/>
        </p>
        <p>
            <label for="author">Author</label>
            <input 
            id="author"
            name="author"
            type="text"
            required
            minlength="1"
            maxlength="99"
            placeholder=""/>
        </p>
        <p>
            <label for="page">Pages</label>
            <input 
            id="page"
            name="page"
            type="number"
            required
            min="1"
            max="9999"
            placeholder=""/>
        </p>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
